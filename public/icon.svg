<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3358" />
      <stop offset="100%" stop-color="#2a4a7b" />
    </linearGradient>
    <linearGradient id="katakanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" />

  <!-- Dual Character Composition: あ (Hiragana) and カ (Katakana) -->
  <g filter="url(#shadow)">
    <!-- Hiragana あ -->
    <text
      x="170"
      y="320"
      font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif"
      font-size="220"
      font-weight="700"
      text-anchor="middle"
      fill="#ffffff"
    >あ</text>

    <!-- Katakana カ -->
    <text
      x="345"
      y="355"
      font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif"
      font-size="190"
      font-weight="800"
      text-anchor="middle"
      fill="url(#katakanaGrad)"
    >カ</text>
  </g>

  <!-- Small aesthetic accent dot -->
  <circle cx="260" cy="140" r="10" fill="#f59e0b" opacity="0.85" />
</svg>
